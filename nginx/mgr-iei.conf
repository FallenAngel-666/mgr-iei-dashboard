# ==============================================================================
# IEI MGR STUDENT CHAPTER — NGINX REVERSE PROXY CONFIGURATION
# Location: /etc/nginx/sites-available/mgr-iei.conf
# Optimized for Hostinger KVM 2 VPS (2 vCPU, 8 GB RAM)
# ==============================================================================

# Rate limit zone at Nginx edge as first line of defense
limit_req_zone $binary_remote_addr zone=edge_ip_limit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

upstream node_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Enforce HTTPS redirect
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # SSL Certificates (managed via Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Root Directory for Vite Compiled Assets
    root /var/www/mgr-iei-platform/dist;
    index index.html;

    # Maximum file upload size (15MB aligned with application limits)
    client_max_body_size 15M;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Connection limits per IP
    limit_conn addr_limit 20;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # 1. API Endpoints -> Node.js / Express Backend
    location /api/ {
        limit_req zone=edge_ip_limit burst=40 nodelay;
        proxy_pass http://node_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 2. Socket.IO WebSocket Real-Time Cluster
    location /socket.io/ {
        proxy_pass http://node_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 3. System Health Check Endpoint
    location /health {
        proxy_pass http://node_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # 4. Uploaded Files
    location /uploads/ {
        alias /var/www/mgr-iei-platform/uploads/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        # Prohibit direct script execution in uploads directory
        location ~ \.(php|sh|cgi|py|exe|html|svg)$ {
            deny all;
        }
    }

    # 5. Static Assets with Aggressive Caching
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 6. Single Page Application (SPA) Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
